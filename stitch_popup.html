<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700;800&amp;family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d1e4fb",
                        "on-tertiary-container": "#f8fdff",
                        "on-primary-fixed-variant": "#314865",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-container": "#5e7594",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#00647a",
                        "secondary-fixed-dim": "#c3c0ff",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f7f9ff",
                        "surface-variant": "#d1e4fb",
                        "on-tertiary-fixed": "#001f27",
                        "on-surface": "#091d2d",
                        "on-tertiary-fixed-variant": "#004e5f",
                        "primary-fixed": "#d2e4ff",
                        "tertiary-fixed": "#b4ebff",
                        "secondary": "#4a3ee6",
                        "tertiary-container": "#007f9a",
                        "surface": "#f7f9ff",
                        "on-surface-variant": "#464555",
                        "surface-container": "#e3efff",
                        "on-secondary-container": "#fffbff",
                        "background": "#f7f9ff",
                        "inverse-surface": "#203243",
                        "on-secondary-fixed": "#0f0069",
                        "surface-tint": "#49607e",
                        "on-background": "#091d2d",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001c37",
                        "inverse-primary": "#b0c8eb",
                        "surface-dim": "#c9dcf2",
                        "outline": "#777587",
                        "surface-container-low": "#edf4ff",
                        "surface-container-high": "#d8eaff",
                        "secondary-fixed": "#e2dfff",
                        "on-secondary-fixed-variant": "#321ed2",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#fbfbff",
                        "primary-fixed-dim": "#b0c8eb",
                        "secondary-container": "#645cff",
                        "primary": "#465d7b",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#e8f2ff",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed-dim": "#3cd7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Sora"],
                        "display": ["Sora"],
                        "body": ["Manrope"],
                        "label": ["DM Mono"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; background: #f7f9ff; }
        .font-sora { font-family: 'Sora', sans-serif; }
        .font-mono { font-family: 'DM Mono', monospace; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .custom-glass { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.8); }
        .sparkline-gradient { background: linear-gradient(to top, rgba(60, 215, 255, 0.1), transparent); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen bg-slate-200">
<!-- Extension Popup Container (360x520) -->
<div class="w-[360px] h-[520px] bg-white overflow-hidden shadow-2xl relative flex flex-col border border-outline-variant/20 rounded-xl">
<!-- TopAppBar (JSON Mapping) -->
<header class="bg-[#0A2540] flex items-center justify-between px-3 py-2 w-full h-[52px] shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#3cd7ff]" style="font-variation-settings: 'FILL' 1;">monitoring</span>
<span class="text-lg font-bold text-white tracking-tighter font-sora">PricePulse</span>
</div>
<div class="bg-white/10 px-2 py-0.5 rounded-full border border-white/20">
<span class="text-[10px] font-bold text-[#3cd7ff] uppercase tracking-wider font-sora">Amazon</span>
</div>
</header>
<!-- Main Body -->
<main class="flex-1 overflow-y-auto bg-surface space-y-4 pb-16">
<!-- Product Identity Card -->
<section class="px-4 pt-4">
<div class="flex gap-4 p-3 bg-white rounded-xl border border-outline-variant/10 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-surface-container overflow-hidden shrink-0">
<img alt="Apple Watch Ultra 2" class="w-full h-full object-cover" data-alt="Close-up of a high-end titanium smart watch with an orange ocean band on a clean white studio background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDt3VLpnZvb2vNqTh5ffyatZAn9bxDruqdep9SoRPFNyYk8dYhP6qFFFil2xra1O5zyiUaGuGIflyb8WiZiHCEuTnG25Xk4tzkyaILSfAViM_ezOvRnI4TX0cmWIjVMAMTPHwX55pcECTWDm-BFhNT5YQ69Pjg4QnyXP0EKzBIzQPIejSr0llO_Mh0pehEBWsvR1TwyxfycxRq61neueQcw7k0y0eTFQkPH35EizjRMMIawYuTr-glfB4NXSoDKaRGwY3l3SI0xIzA"/>
</div>
<div class="flex flex-col justify-center overflow-hidden">
<h1 class="text-[13px] font-bold text-on-surface truncate font-sora">Apple Watch Ultra 2</h1>
<div class="flex items-baseline gap-1">
<span class="text-[18px] font-medium text-on-surface font-mono">₹79,000</span>
<span class="text-[10px] text-outline font-mono">MRP ₹89,900</span>
</div>
</div>
</div>
</section>
<!-- Price Pulse Chart (Asymmetric Layout) -->
<section class="px-4">
<div class="bg-white rounded-xl p-4 border border-outline-variant/10">
<div class="flex justify-between items-center mb-4">
<h2 class="text-[11px] font-bold text-on-surface uppercase tracking-widest font-sora">30-Day History</h2>
<span class="text-[10px] font-mono text-tertiary-container flex items-center gap-1">
                             Lowest: ₹76,999
                        </span>
</div>
<!-- Sparkline Simulation -->
<div class="h-16 w-full relative overflow-hidden rounded-lg sparkline-gradient flex items-end">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 100 40">
<path d="M0,35 Q10,10 20,30 T40,20 T60,35 T80,10 T100,25" fill="none" stroke="#4a3ee6" stroke-width="2" vector-effect="non-scaling-stroke"></path>
<circle cx="80" cy="10" fill="#3cd7ff" r="2"></circle>
</svg>
<div class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/0 to-white/20 pointer-events-none"></div>
</div>
<div class="flex justify-between mt-2 text-[9px] font-mono text-outline">
<span>30 DAYS AGO</span>
<span>TODAY</span>
</div>
</div>
</section>
<!-- Comparison List (Editorial Styled Rows) -->
<section class="px-4 space-y-1">
<div class="flex items-center justify-between mb-2">
<h2 class="text-[11px] font-bold text-on-surface uppercase tracking-widest font-sora">Compare Prices</h2>
<span class="material-symbols-outlined text-[14px] text-outline">info</span>
</div>
<!-- Row 1: Flipkart -->
<div class="h-[52px] flex items-center justify-between px-3 bg-surface-container-low rounded-lg transition-all hover:bg-surface-container-high group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-[10px] font-bold text-blue-600 shadow-sm border border-outline-variant/10">F</div>
<div class="flex flex-col">
<span class="text-[12px] font-semibold text-on-surface font-sora">Flipkart</span>
<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full font-bold uppercase tracking-tighter w-fit">SAVE ₹1,500</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-[15px] font-medium text-on-surface font-mono">₹77,500</span>
<button class="w-7 h-7 flex items-center justify-center rounded-full bg-secondary text-white shadow-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
</div>
<!-- Row 2: Reliance -->
<div class="h-[52px] flex items-center justify-between px-3 bg-surface-container-low rounded-lg transition-all hover:bg-surface-container-high group">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-[10px] font-bold text-red-600 shadow-sm border border-outline-variant/10">R</div>
<div class="flex flex-col">
<span class="text-[12px] font-semibold text-on-surface font-sora">Reliance</span>
<span class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded-full font-bold uppercase tracking-tighter w-fit">+₹2,200</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-[15px] font-medium text-on-surface font-mono">₹81,200</span>
<button class="w-7 h-7 flex items-center justify-center rounded-full bg-white border border-outline-variant text-outline group-hover:bg-secondary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Strip -->
<footer class="absolute bottom-0 left-0 w-full bg-[#F6F9FC] border-t border-[#E6E9F0] px-4 py-3 z-10">
<button class="w-full h-11 bg-[#635BFF] text-white rounded-lg font-bold text-sm tracking-tight flex items-center justify-center gap-2 shadow-lg shadow-secondary/20 hover:bg-[#4a3ee6] active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
                Set Alert
            </button>
</footer>
<!-- BottomNavBar (JSON Mapping State - Settings Intent) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-4 bg-white hidden">
<!-- Hidden by design as per Shell Visibility rules (Transactional/Action focused popup) -->
<div class="text-slate-500 p-2"><span class="material-symbols-outlined">notifications_active</span></div>
<div class="bg-[#4a3ee6] text-white rounded-full p-2"><span class="material-symbols-outlined">query_stats</span></div>
<div class="text-slate-500 p-2"><span class="material-symbols-outlined">settings</span></div>
</nav>
</div>
</body></html>
